<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI闯关答题小程序·企业版 — 成长与团队</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#FDF6D8; --ink:#2B3A67; --red:#E84855; --green:#8AC926;
    --orange:#FF9F1C; --gray:#C9C9C9; --line:#2B3A67;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Sans SC",sans-serif;background:#f1e9c8;
    background-image:radial-gradient(#e7dcae 1px,transparent 1px);background-size:22px 22px;
    padding:32px 16px;color:var(--ink);}
  .head{max-width:1180px;margin:0 auto 26px;}
  .head h1{font-family:"ZCOOL KuaiLe",cursive;font-size:34px;}
  .head p{font-size:14px;color:#6b6450;margin-top:6px;}
  .grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:680px){.grid{grid-template-columns:1fr;}}
  .phone{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;
    width:100%;max-width:375px;height:780px;margin:0 auto;position:relative;overflow:hidden;
    box-shadow:6px 6px 0 rgba(43,58,103,.18);}
  .phone::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);
    width:90px;height:22px;background:rgba(201,201,201,.75);border:1px dashed #9c9c9c;}
  .scr{padding:26px 18px 18px;height:100%;display:flex;flex-direction:column;gap:14px;}
  .tag{font-family:"ZCOOL KuaiLe",cursive;font-size:13px;color:var(--red);
       border:1.5px solid var(--red);border-radius:20px;padding:2px 10px;align-self:flex-start;}
  .title{font-family:"ZCOOL KuaiLe",cursive;font-size:24px;line-height:1.2;}
  .bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:12px;
          padding:8px 12px;font-size:13px;max-width:84%;box-shadow:3px 3px 0 rgba(43,58,103,.15);}
  .bubble::after{content:"";position:absolute;left:18px;bottom:-9px;border:7px solid transparent;border-top-color:var(--ink);}
  .btn{font-family:"ZCOOL KuaiLe",cursive;font-size:16px;color:#fff;background:var(--red);
       border:none;border-radius:10px;padding:11px 14px;text-align:center;box-shadow:3px 3px 0 rgba(43,58,103,.25);}
  .btn.green{background:var(--green);} .btn.orange{background:var(--orange);color:var(--ink);}
  .card{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:12px;box-shadow:2px 2px 0 rgba(43,58,103,.12);}
  .path{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:14px;}
  .path::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;
    background:repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 12px);}
  .lv{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:9px 11px;font-size:13px;position:relative;}
  .lv .s{position:absolute;right:10px;top:9px;color:var(--orange);}
  .lv.lock{opacity:.5;}
  .rank{display:flex;align-items:center;gap:10px;border-bottom:1.5px dashed var(--gray);padding:8px 2px;font-size:13px;}
  .rank .n{font-family:"ZCOOL KuaiLe",cursive;font-size:18px;width:24px;}
  .rank.top .n{color:var(--red);}
  .share{background:#fffdf2;border:2px dashed var(--red);border-radius:12px;padding:14px;text-align:center;}
  .share .big{font-family:"ZCOOL KuaiLe",cursive;font-size:30px;color:var(--red);}
  .foot{margin-top:auto;font-size:11px;color:#9c957a;text-align:center;}
</style>
</head>
<body>
  <div class="head">
    <h1>成长与团队</h1>
    <p>分组 B — 关卡地图 · 分享挑战卡 · 个人中心（草稿纸 / 阿衰漫画风）</p>
  </div>

  <div class="grid">
    <!-- B1 关卡地图 -->
    <div class="phone">
      <div class="scr">
        <span class="tag">关卡地图</span>
        <div class="title">闯关路线</div>
        <div class="bubble">一级级啃，阿衰也能通关</div>
        <div class="path">
          <div class="lv">📘 入职制度 <span class="s">⭐✓</span></div>
          <div class="lv">📗 产品知识 <span class="s">⭐60%</span></div>
          <div class="lv">📙 合规考核 <span class="s">⭐</span></div>
          <div class="lv lock">🏆 年度大考 <span class="s">🔒</span></div>
        </div>
        <button class="btn green">继续闯关 →</button>
        <div class="foot">涂鸦星星进度 · 002</div>
      </div>
    </div>

    <!-- B3 分享挑战卡 + B4 个人中心合并展示 -->
    <div class="phone">
      <div class="scr">
        <span class="tag">分享卡 / 个人</span>
        <div class="share">
          <div style="font-size:12px;color:#6b6450;">我的成绩卡</div>
          <div class="big">72 分</div>
          <div style="font-size:12px;">已通关 3 关 · 连续 7 天</div>
          <div style="font-family:'ZCOOL KuaiLe';font-size:16px;color:var(--red);margin-top:6px;">不服来战 → 部门群</div>
        </div>
        <div class="card">
          <div class="rank"><span class="n" style="color:var(--orange)">🔥</span>连续打卡 <b style="margin-left:auto">7 天</b></div>
          <div class="rank"><span class="n" style="color:var(--orange)">★</span>积分 <b style="margin-left:auto">120</b></div>
          <div class="rank"><span class="n" style="color:var(--red)">✎</span>错题本 <b style="margin-left:auto">18 题</b></div>
        </div>
        <button class="btn">进个人中心 →</button>
        <div class="foot">内部裂变 · 非公开分享</div>
      </div>
    </div>
  </div>
</body>
</html>
